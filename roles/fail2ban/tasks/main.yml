    - name: install fail2ban
      become: true
      apt:
        name: 
          - fail2ban
        state: present

    - name: configure fail2ban
      become: true
      blockinfile:
        path: /etc/fail2ban/jail.local
        block: |
          [DEFAULT]
          # the IP address range we want to ignore
          ignoreip = 127.0.0.1/8

          # who to send e-mail to
          destemail = {{ mail_to }}

          # who is the email from
          sender = {{ mail_from }}

          # since we're using s-nail to send emails
          mta = sendmail

          # get email alerts
          action = %(action_mwl)s
        create: true
      notify: restart fail2ban service

    - name: fail2ban - configure ssh jail
      become: true
      blockinfile:
        path: /etc/fail2ban/jail.d/ssh.local
        block: |
          [sshd]
          enabled = true
          banaction = nftables[type=multiport]
          port = {{ ssh_port }}
          filter = sshd
          backend = systemd
          maxretry = 5
        create: true
      notify: restart fail2ban service

    - name: nftables - add dependency
      become: true
      blockinfile:
        path: /etc/systemd/system/fail2ban.service.d/override.conf
        block: |
          [Unit]
          Requires=nftables.service
          PartOf=nftables.service

          [Install]
          WantedBy=multi-user.target nftables.service
          EOF
        create: true
      notify: restart fail2ban service


    - name: Ensure nftables service is running
      become: true
      service:
        name: nftables
        state: started

    - name: Ensure fail2ban service is running
      become: true
      service:
        name: fail2ban
        state: started

