    - name: install mail packages
      become: true
      apt:
        name:
          - msmtp
          - msmtp-mta
          - bsd-mailx
        state: present
        update_cache: yes

    # --- msmtp config ---
    - name: deploy msmtp config
      become: true
      template:
        src: msmtprc.j2
        dest: /etc/msmtprc
        owner: root
        group: root
        mode: '0600'

    # --- ensure log file exists ---
    - name: create msmtp log file
      become: true
      file:
        path: /var/log/msmtp.log
        state: touch
        owner: root
        group: root
        mode: '0644'

    # --- aliases ---
    - name: configure root mail forwarding
      become: true
      lineinfile:
        path: /etc/aliases
        regexp: '^root:'
        line: 'root: {{ mail_to }}'
        create: true

    - name: rebuild aliases database
      become: true
      command: newaliases

    # --- mailx config (force correct sendmail path) ---
    - name: configure mailx to use sendmail
      become: true
      lineinfile:
        path: /etc/mail.rc
        regexp: '^set sendmail='
        line: 'set sendmail=/usr/sbin/sendmail'
        create: yes

    # --- test mail ---
    - name: send test mail
      become: true
      shell: |
        echo "Testmail content" | mail -s "Testmail subject" {{ mail_to }}
      args:
        executable: /bin/bash

