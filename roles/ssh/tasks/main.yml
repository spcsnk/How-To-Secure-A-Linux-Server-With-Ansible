    - name: ensure sshd includes config directory
      become: true
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^Include\s+/etc/ssh/sshd_config\.d/\*\.conf'
        line: 'Include /etc/ssh/sshd_config.d/*.conf'
        state: present
        insertafter: BOF
        create: false
      notify: restart ssh service

    - name: ensure sshd_config.d exists
      become: true
      file:
        path: /etc/ssh/sshd_config.d
        state: directory
        mode: '0755'

    - name: remove conflicting ssh directives
      become: true
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item }}"
        state: absent
      loop:
        - '^Subsystem\s+sftp'
        - '^Port\s+'
        - '^ListenAddress\s+'
        - '^AllowGroups\s+'
      notify: restart ssh service

    - name: deploy ssh hardening config
      become: true
      template:
        src: sshd_hardening.conf.j2
        dest: /etc/ssh/sshd_config.d/99-hardening.conf
        owner: root
        group: root
        mode: '0644'
      notify: restart ssh service

    - name: remove short diffie diffie-hellman
      become: true
      shell:
        creates: /etc/ssh/moduli.short
        cmd: |
          cp /etc/ssh/moduli /etc/ssh/moduli.short
          awk '$5 >= 3071' /etc/ssh/moduli | tee /etc/ssh/moduli.tmp
          if ! cmp /etc/ssh/moduli /etc/ssh/moduli.tmp; then
            mv /etc/ssh/moduli.tmp /etc/ssh/moduli
          fi
      notify: restart ssh service
      register: moduli_changed
      changed_when: "'differ:' in moduli_changed.stdout"

    - name: validate ssh configuration
      become: true
      command: sshd -t
      register: sshd_check
      changed_when: false
